[build]
  command = "node build-config.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# SPA de una sola página: cualquier ruta desconocida vuelve a index.html.
# (La app resuelve internamente las vistas: login, onboarding, dashboard, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self)"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
